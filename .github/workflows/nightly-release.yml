name: Nightly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist
      - name: Package
        env:
          TZ: UTC
        run: |
          cd dist
          for target in */; do
            chmod 644 "$target"/*
            touch -t 198001010000 "$target"/*
            zip -0 -X -j "${target%/}.zip" "$target"/*
          done
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum ./*.zip > SHA256SUMS
          tag="nightly-$(date -u +%Y%m%d)-${GITHUB_SHA:0:12}"
          gh release create "$tag" ./*.zip SHA256SUMS \
            --target "$GITHUB_SHA" --title "$tag" \
            --notes "Built from $GITHUB_SHA." \
            --latest
